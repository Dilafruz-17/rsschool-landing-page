<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee House | Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;1,600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="header">
        <a class="header__logo" href="index.html">
            <img src="assets/images/logo.svg" alt="Coffee House logo" width="100" height="60">
        </a>

        <nav class="header__nav" aria-label="Main navigation">
            <ul class="nav-list">
                <li><a href="index.html#favorite-coffee">Favorite coffee</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#mobile-app">Mobile app</a></li>
                <li><a href="index.html#contact">Contact us</a></li>
            </ul>
        </nav>

        <button class="theme-switch" type="button" aria-label="Toggle theme"></button>

        <a class="header__menu-link" href="menu.html">Menu</a>
    </header>

        <main>
            <section class="catalog">
                <h1 class="section-title">Our <em>Menu</em></h1>
        
                <nav class="catalog__categories" aria-label="Menu categories">
                    <ul class="catalog__categories-list">
                        <li><button class="catalog__category-btn catalog__category-btn--active" type="button">Coffee</button>
                        </li>
                        <li><button class="catalog__category-btn" type="button">Tea</button></li>
                        <li><button class="catalog__category-btn" type="button">Desserts</button></li>
                    </ul>
                </nav>
        
                <div class="catalog__grid">
                    <article class="catalog__card">
                        <img src="assets/images/coffee-slider-1.png" alt="S'mores Frappuccino" width="300" height="300">
                        <h3 class="catalog__card-name">S'mores Frappuccino</h3>
                        <p class="catalog__card-price">$5.50</p>
                    </article>
                    <article class="catalog__card">
                        <img src="assets/images/coffee-slider-2.png" alt="Caramel Latte" width="300" height="300">
                        <h3 class="catalog__card-name">Caramel Latte</h3>
                        <p class="catalog__card-price">$4.80</p>
                    </article>
                    <article class="catalog__card">
                        <img src="assets/images/coffee-slider-3.png" alt="Classic Cappuccino" width="300" height="300">
                        <h3 class="catalog__card-name">Classic Cappuccino</h3>
                        <p class="catalog__card-price">$4.20</p>
                    </article>
                </div>
            </section>
        </main>

        <footer class="footer" id="contact">
            <div class="footer__slogan">
                <p class="footer__title">Sip, Savor, Smile. <em>It's coffee time!</em></p>
            </div>
            <div class="footer__contacts">
                <h2 class="footer__heading">Contact us</h2>
                <ul>
                    <li>8529 Sunset Rd., LA</li>
                    <li>+1 (603) 555-0123</li>
                    <li>Mon-Sat: 9:00-22:00</li>
                </ul>
            </div>
        </footer>
        
        <script src="js/script.js"></script>

    <script src="js/script.js"></script>
</body>

</html>
